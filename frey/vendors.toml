sources = [
    "https://api-docs.deepseek.com/ (2026-10-25: base_url https://api.deepseek.com and https://api.deepseek.com/anthropic, ${DEEPSEEK_API_KEY})",
    "https://api-docs.deepseek.com/guides/tool_calls (2026-10-25: strict mode needs base_url https://api.deepseek.com/beta)",
    "https://api-docs.deepseek.com/guides/chat_prefix_completion (2026-10-25: prefix completion needs the beta base_url)",
    "https://api-docs.deepseek.com/guides/responses_api (2026-10-27: base_url https://api.deepseek.com; stateless, store / previous_response_id / include unsupported and silently ignored; a reasoning item's plain content is merged into the adjacent assistant message; no data: [DONE])",
]
models_dev = "deepseek"
verified = "run"
checked = "2026-10-27"
note = "OpenAI-compatible by default: DeepSeek's own protocol, and the reasoning goes back as reasoning_content (AD93; its Anthropic-compatible endpoint ignores cache_control). Not the /beta address: what it adds is strict function calling (every property required, additionalProperties false, `strict: true` on each function — frey's tool schemas have optional properties and frey sends no `strict`) and chat prefix completion, neither of which frey uses; the same tool round trip works on both (T-0043 ⑫). Its Responses API (POST /v1/responses, also /responses) is there to choose with provider.type = \"responses\": a read_file → edit_file → run_shell round trip with frey, 2026-10-27 (T-0059)."

