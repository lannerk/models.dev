# Model vendor presets (AD94, AD95; T-0043). `provider.vendor = "<name>"` fills `provider.type`,
# `base_url`, `openai_compat.endpoint` / `responses.endpoint`, `api_key_env` and
# `openai_compat.supports_reasoning` with these
# values under whatever the configuration writes itself. Model names are never preset (AD94).
#
# Every entry: the vendor's own documentation it was taken from (with the day it was read), and
# `verified` — "run": a real read_file → edit_file → run_shell round trip with frey; "docs": the
# documentation only, never run. Read by `frey-vendors` (compiled in) and by its tests, which refuse an
# entry with a field missing.
#
# `models_dev` (T-0112): the models.dev provider id whose models the facts table (configs/models-facts.json,
# tools/models_facts.py) takes for this preset; none: the preset has no facts (Ollama is local).
# Fields: name, display, type (the protocol used when `provider.type` is not written), openai_base_url +
# openai_endpoint and/or messages_base_url (the client appends `/v1/messages`) and/or responses_base_url +
# responses_endpoint (OpenAI's Responses API, T-0059; `provider.type = "responses"`) and/or gemini_base_url
# (Google's Gemini API, version included, T-0060; `provider.type = "gemini"`), api_key_env (the
# vendor's documented name where it gives one), supports_reasoning, hosts (more hosts for detection;
# a leading "." matches any subdomain), sources, verified, checked, note.
#
# Not in the table (2026-10-25): ByteDance Volcengine Ark (Doubao), Baidu Qianfan (ERNIE) and Tencent
# Hunyuan — their documentation pages are rendered by script and could not be read that day
# (docs.volcengine.com, cloud.baidu.com/doc/qianfan-api, cloud.tencent.com/document/product/1729 came
# back empty), so nothing about them is confirmed; `provider.vendor = "other"` with their address still
# works.

